# Nombre de la aplicación
spring.application.name=catalogo

# Servidor: localhost. Puerto: 3306. Base de datos: catalogo
spring.datasource.url=jdbc:mysql://localhost:3306/catalogo

# Usuario para conectarse a MySQL.
spring.datasource.username=root
spring.datasource.password=

# Clase del controlador JDBC que permite conectarse con MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
# Valida que la estructura de las tablas coincidan con las entidades.
# Hibernate no crea ni modifica tablas; esta tarea la realiza Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Muestra en la consola las sentencias SQL ejecutadas por Hibernate.
spring.jpa.show-sql=true
# Presenta las sentencias SQL con un formato más legible.
spring.jpa.properties.hibernate.format_sql=true

# El microservicio estará disponible en http://localhost:8083.
server.port=8083

# Habilita la ejecución de las migraciones pendientes al iniciar.
spring.flyway.enabled=true

# Corresponde a src/main/resources/db/migration. Contiene los scripts de migración de la base de datos.
spring.flyway.locations=classpath:db/migration

# Para el Eureka Server, que se encuentra en http://localhost:8761. El microservicio se registrará en el Eureka Server y podrá descubrir otros microservicios registrados.
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=127.0.0.1
eureka.instance.instance-id=127.0.0.1:${spring.application.name}:${server.port}

jwt.secreto=${JWT_SECRET:losmaestros_examen_clave_2026_segura}