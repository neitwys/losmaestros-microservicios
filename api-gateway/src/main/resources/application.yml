server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: ruta-autenticacion
              uri: lb://AUTENTICACION
              predicates:
                - Path=/autenticacion/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Origin

            - id: ruta-carrito
              uri: lb://CARRITO
              predicates:
                - Path=/carrito/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Origin

            - id: ruta-catalogo
              uri: lb://CATALOGO
              predicates:
                - Path=/catalogo/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Origin

            - id: ruta-mensaje
              uri: lb://MENSAJE
              predicates:
                - Path=/mensaje/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Origin

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: 127.0.0.1
    instance-id: 127.0.0.1:${spring.application.name}:${server.port}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
