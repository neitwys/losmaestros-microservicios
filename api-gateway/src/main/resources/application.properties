server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: ruta-autenticacion
          uri: lb://AUTENTICACION
          predicates:
            - Path=/autenticacion/**

        - id: ruta-carrito
          uri: lb://CARRITO
          predicates:
            - Path=/carrito/**

        - id: ruta-catalogo
          uri: lb://CATALOGO
          predicates:
            - Path=/catalogo/**

        - id: ruta-mensaje
          uri: lb://MENSAJE
          predicates:
            - Path=/mensaje/**


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: 127.0.0.1
    instance-id: 127.0.0.1:${spring.application.name}:${server.port}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG